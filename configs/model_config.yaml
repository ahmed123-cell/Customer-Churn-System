# configs/model_config.yaml
#
# Default hyperparameters for every model builder in models_builder.py.
# Top-level keys match the MODEL_BUILDERS registry names exactly, so this
# file can also be used to decide which models to run (see `enabled`).
#
# `null` means "use the automatic/None behavior already coded in
# models_builder.py" (e.g. scale_pos_weight computed from y_train,
# max_depth grown fully, etc.) — it is not a literal Python None override
# unless the builder already treats None that way.

logistic_regression:
  enabled: true
  params:
    C: 1.0
    solver: lbfgs
    max_iter: 1000
    class_weight: balanced
    random_state: 42

linear_svm:
  enabled: true
  params:
    C: 1.0
    class_weight: balanced
    max_iter: 5000
    random_state: 42

decision_tree:
  enabled: true
  params:
    max_depth: 5
    min_samples_leaf: 20
    class_weight: balanced
    random_state: 42

random_forest:
  enabled: true
  params:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
    random_state: 42

gradient_boosting:
  enabled: true
  params:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    subsample: 0.8
    random_state: 42

xgboost:
  enabled: true
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: null
    random_state: 42
    n_jobs: -1

lightgbm:
  enabled: true
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: null
    random_state: 42
    n_jobs: -1